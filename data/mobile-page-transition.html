<script>
(() => {
  const phone = matchMedia('(max-width: 767px)');
  const motion = matchMedia('(prefers-reduced-motion: no-preference)');
  const key = 'swm-footer-navigation';
  const root = document.documentElement;
  let loaderTimer;
  let loaderTimeout;

  function readNavigation() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(key));
      if (Date.now() - saved?.time < 10000) return saved;
    } catch {}
  }

  function clearLoader() {
    clearTimeout(loaderTimer);
    clearTimeout(loaderTimeout);
    delete root.dataset.footerLoading;
    root.style.removeProperty('--navigation-header-height');
  }

  const arrival = readNavigation();
  if (phone.matches && arrival?.to === location.href) {
    root.dataset.footerLoading = arrival.page;
    document.addEventListener('DOMContentLoaded', clearLoader, { once: true });
  }

  document.addEventListener('click', event => {
    const link = event.target.closest?.('.mobile-ecom-tabbar a[href]');
    if (!phone.matches || !link || event.defaultPrevented || event.button !== 0 ||
        event.ctrlKey || event.metaKey || event.altKey || event.shiftKey ||
        link.origin !== location.origin || link.href === location.href) return;

    const tabs = [...link.parentNode.querySelectorAll('a[href]')];
    const current = tabs.findIndex(tab => tab.classList.contains('is-active'));
    const direction = tabs.indexOf(link) < current ? 'right' : 'left';
    const page = link.pathname.split('/').pop().replace(/\.html$/, '');
    try {
      sessionStorage.setItem(key, JSON.stringify({ from: location.href, to: link.href, direction, page, time: Date.now() }));
    } catch {}
    clearLoader();
    loaderTimer = setTimeout(() => {
      const header = document.querySelector('.store-header');
      const headerBottom = header?.getBoundingClientRect().bottom || 0;
      root.style.setProperty('--navigation-header-height', `${Math.max(headerBottom, 0)}px`);
      root.dataset.footerLoading = page;
    }, 110);
    loaderTimeout = setTimeout(clearLoader, 10000);
    link.classList.add('is-navigating');
    setTimeout(() => link.classList.remove('is-navigating'), 1200);
  });

  function animatePage(event, outgoing) {
    if (!outgoing) delete root.dataset.footerSlide;
    const transition = event.viewTransition;
    const navigation = readNavigation();
    if (!outgoing) {
      try { sessionStorage.removeItem(key); } catch {}
    }

    const destination = event.activation?.entry?.url;
    const matches = outgoing
      ? navigation?.from === location.href && (!destination || navigation.to === destination)
      : navigation?.to === location.href;
    if (!phone.matches || !motion.matches || !matches) return;

    const animateArrival = () => {
      if (!motion.matches) return;
      root.dataset.footerArrival = navigation.direction;
      const cleanup = event => {
        if (event.animationName !== 'footer-arrival') return;
        delete root.dataset.footerArrival;
        document.removeEventListener('animationend', cleanup);
      };
      document.addEventListener('animationend', cleanup);
    };
    if (!transition) {
      if (!outgoing) animateArrival();
      return;
    }
    root.dataset.footerSlide = navigation.direction;
    if (!outgoing) {
      transition.ready.catch(animateArrival);
      transition.finished.then(() => { delete root.dataset.footerSlide; });
    }
  }

  window.addEventListener('pageswap', event => animatePage(event, true));
  if ('onpagereveal' in window) {
    window.addEventListener('pagereveal', event => animatePage(event, false));
  } else {
    animatePage({}, false);
  }
  window.addEventListener('pageshow', () => {
    clearLoader();
    document.querySelector('.mobile-ecom-tabbar .is-navigating')?.classList.remove('is-navigating');
  });
})();
</script>
