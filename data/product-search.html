<section class="section product-search-page" aria-labelledby="product-search-title">
  <h1 id="product-search-title">Search products</h1>
  <form class="product-search-form" role="search" action="search.html">
    <label class="sr-only" for="product-search-query">Search the product catalogue</label>
    <input type="search" id="product-search-query" name="q" placeholder="Product name, type, or model" autocomplete="off">
    <button type="submit" class="button">Search</button>
  </form>
  <p id="product-search-status" role="status" hidden></p>
  <div class="product-grid" id="product-search-results"></div>
  <button class="button" id="product-search-more" type="button" hidden>Show more products</button>
</section>
